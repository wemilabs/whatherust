[package]
name = "whatherust"
version = "0.1.0"
description = "WhatheRust: a lightweight native webview wrapper for WhatsApp Web"
license = "MIT"
edition = "2024"

[lib]
name = "whatherust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whatherust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "objc2-app-kit"] }
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm"] }
