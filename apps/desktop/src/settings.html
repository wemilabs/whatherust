<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatheRust Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #242424;
        background: #f7f7f7;
        --accent: #b7410e;
        --border: #dedede;
        --muted: #666;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #ededed;
          background: #0f0f0f;
          --accent: #f0703f;
          --border: #343434;
          --muted: #aaa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: inherit;
        font-size: 14px;
      }

      main {
        padding: 18px 24px 12px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .setting-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 67px;
        border-top: 1px solid var(--border);
        cursor: pointer;
      }

      .setting-copy {
        display: grid;
        gap: 3px;
      }

      .setting-title {
        font-weight: 550;
      }

      .setting-description,
      #status {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .switch-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .switch {
        position: relative;
        flex: 0 0 38px;
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: #aaa;
        transition: background-color 120ms ease;
      }

      .switch::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        content: "";
        transition: transform 120ms ease;
      }

      .switch-input:checked + .switch {
        background: var(--accent);
      }

      .switch-input:checked + .switch::after {
        transform: translateX(16px);
      }

      .switch-input:focus-visible + .switch {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .switch-input:disabled + .switch {
        opacity: 0.55;
      }

      #status {
        min-height: 17px;
        margin: 6px 0 0;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <section aria-label="Application settings">
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title">Start on login</span>
            <span class="setting-description">Open WhatheRust when you sign in.</span>
          </span>
          <input class="switch-input" type="checkbox" name="start_on_login" role="switch" disabled>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title">Close to tray</span>
            <span class="setting-description">Keep running in the tray when the window is closed. Off: closing quits.</span>
          </span>
          <input class="switch-input" type="checkbox" name="close_to_tray" role="switch" disabled>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title">Notifications</span>
            <span class="setting-description">Show desktop notifications for new messages.</span>
          </span>
          <input class="switch-input" type="checkbox" name="notifications_enabled" role="switch" disabled>
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const controls = [...document.querySelectorAll('input[type="checkbox"]')];
      const status = document.querySelector("#status");
      let settings;

      function setBusy(busy) {
        controls.forEach((control) => {
          control.disabled = busy;
        });
      }

      async function loadSettings() {
        setBusy(true);
        try {
          settings = await window.__TAURI_INTERNALS__.invoke("get_settings");
          controls.forEach((control) => {
            control.checked = settings[control.name];
          });
          status.textContent = "";
        } catch (error) {
          status.textContent = `Unable to load settings: ${String(error)}`;
        } finally {
          setBusy(false);
        }
      }

      controls.forEach((control) => {
        control.addEventListener("change", async () => {
          if (!settings) return;

          const previous = settings;
          const next = { ...settings, [control.name]: control.checked };
          setBusy(true);
          status.textContent = "";
          try {
            settings = await window.__TAURI_INTERNALS__.invoke("set_settings", {
              settings: next,
            });
          } catch (error) {
            control.checked = previous[control.name];
            status.textContent = `Unable to save settings: ${String(error)}`;
          } finally {
            setBusy(false);
          }
        });
      });

      loadSettings();
    </script>
  </body>
</html>
