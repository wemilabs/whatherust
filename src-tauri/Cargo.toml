[package]
name = "whatsapp-desktop-rs"
version = "0.1.0"
description = "WhatheRust: a lightweight native webview wrapper for WhatsApp Web"
edition = "2024"

[lib]
name = "whatsapp_desktop_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whatsapp-desktop-rs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm"] }
